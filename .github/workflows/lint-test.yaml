# Adapted from https://github.com/prometheus-community/helm-charts/blob/main/.github/workflows/ci.yaml
name: CI
permissions: {}

on:
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  lint-test:
    name: Lint and Test Charts
    runs-on: ubuntu-24.04
    needs: docs-check
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed="$(ct list-changed --config .github/linters/ct.yaml)"
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_list=\"${changed//$'\n'/ }\"" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --config .github/linters/ct.yaml

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: steps.list-changed.outputs.changed == 'true'

      - name: Run chart-testing (install)
        run: ct install --config .github/linters/ct.yaml --helm-extra-set-args "--set=testing.enabled=true"

  migration-test:
    name: Migration Hook Test
    runs-on: ubuntu-24.04
    needs: docs-check
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve migration versions
        id: versions
        run: |
          set -euo pipefail
          base_branch="${{ github.base_ref }}"
          if [[ -z "$base_branch" ]]; then
            echo "github.base_ref is empty; this test expects a pull_request event" >&2
            exit 1
          fi

          git fetch --no-tags origin "$base_branch"

          from="$(git show "origin/$base_branch:charts/leantime/Chart.yaml" | yq e '.appVersion' -)"
          to="$(yq e '.appVersion' charts/leantime/Chart.yaml)"

          if [[ -z "$from" || "$from" == "null" || -z "$to" || "$to" == "null" ]]; then
            echo "Could not resolve appVersion (from=$from to=$to)" >&2
            exit 1
          fi

          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"
          echo "Migration test: $from -> $to"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: migration-test

      - name: Build chart dependencies
        run: helm dependency build charts/leantime

      - name: Install the previous app version
        env:
          FROM_VERSION: ${{ steps.versions.outputs.from }}
        run: |
          set -euo pipefail
          helm install leantime-migration charts/leantime \
            --namespace leantime-migration \
            --create-namespace \
            --set testing.enabled=true \
            --set image.tag="$FROM_VERSION" \
            --set image.pullPolicy=Always \
            --wait --timeout 10m

          kubectl -n leantime-migration rollout status statefulset/leantime-migration-mariadb --timeout=5m
          kubectl -n leantime-migration rollout status deploy/leantime-migration --timeout=5m

      - name: Seed, upgrade with the hook, verify
        env:
          FROM_VERSION: ${{ steps.versions.outputs.from }}
          TO_VERSION: ${{ steps.versions.outputs.to }}
        run: |
          set -euo pipefail
          ns=leantime-migration
          release=leantime-migration

          # Reads the schema version the running image expects from its own code.
          image_db_version() {
            kubectl -n "$ns" exec deploy/"$release" -- \
              php -r 'require "/var/www/html/app/Core/Configuration/AppSettings.php"; echo (new \Leantime\Core\Configuration\AppSettings())->dbVersion;' |
              tr -d '[:space:]'
          }

          # Reads the schema version recorded in the database.
          db_version() {
            local pod
            pod="$(kubectl -n "$ns" get pods -l app.kubernetes.io/name=mariadb -o jsonpath='{.items[0].metadata.name}')"
            printf "select value from zp_settings where \`key\`='db-version';\n" |
              kubectl -n "$ns" exec -i "$pod" -- bash -c \
                'mariadb -uleantime -p"$(cat /opt/bitnami/mariadb/secrets/mariadb-password)" leantime -N' |
              tr -d '[:space:]'
          }

          from_schema="$(image_db_version)"
          echo "image $FROM_VERSION expects schema $from_schema"

          # Install the DB non-interactively with the previous app version.
          kubectl -n "$ns" exec deploy/"$release" -- \
            php bin/leantime db:migrate \
              --email=admin@example.com \
              --password='MigrationTest1!' \
              --company-name='Migration Test' \
              --first-name='Migration' \
              --last-name='Test'

          before="$(db_version)"
          echo "schema before upgrade: $before (expected $from_schema)"
          test "$before" = "$from_schema"

          if [[ "$FROM_VERSION" == "$TO_VERSION" ]]; then
            echo "::warning::FROM_VERSION and TO_VERSION are both $TO_VERSION; migration is a no-op"
          fi

          # This runs the pre-upgrade hook against the old database.
          helm upgrade "$release" charts/leantime \
            --namespace "$ns" \
            --set testing.enabled=true \
            --set migration.enabled=true \
            --set image.tag="$TO_VERSION" \
            --set image.pullPolicy=Always \
            --wait --timeout 15m

          to_schema="$(image_db_version)"
          after="$(db_version)"
          echo "image $TO_VERSION expects schema $to_schema"
          echo "schema after upgrade: $after"
          test "$after" = "$to_schema"

          image="$(kubectl -n "$ns" get deploy "$release" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "app image: $image"
          case "$image" in
            *":$TO_VERSION"*) ;;
            *) echo "unexpected app image: $image" >&2; exit 1 ;;
          esac

      - name: Collect diagnostics
        if: failure()
        run: |
          ns=leantime-migration
          kubectl -n "$ns" get pods,jobs,statefulsets,deployments -o wide || true
          kubectl -n "$ns" describe pods || true
          kubectl -n "$ns" logs -l app.kubernetes.io/name=leantime --tail=200 || true
          kubectl -n "$ns" logs job/leantime-migration-migrate --tail=200 || true
          kubectl -n "$ns" logs -l app.kubernetes.io/name=mariadb --tail=100 || true

  super-linter:
    name: Lint All
    runs-on: ubuntu-24.04
    needs: docs-check
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: .github/linters
          MULTI_STATUS: false
          VALIDATE_ALL_CODEBASE: false
          # If you set any of the VALIDATE_[LANGUAGE] variables to true, super-linter defaults to leaving any unset variable to false (only validate those languages).
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          # VALIDATE_CHECKOV: true - always scans everything and all charts have too much errors
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITLEAKS: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_NATURAL_LANGUAGE: true
          VALIDATE_PYTHON: true
          #VALIDATE_RENOVATE: false # does not support newest renovate config
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_XML: true

  docs-check:
    name: Check Charts Docs
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Ensure documentation is updated
        uses: docker://jnorwood/helm-docs:v1.14.2

      - name: Ensure charts list is up-to-date too
        run: |
          # We should have yq installed...
          ./bin/update-readme.sh

      - name: Check for changes
        id: check
        run: |
          if git diff --exit-code; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on forks
        if: steps.check.outputs.no_changes == 'false' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo -e "\n####### Git changes detected! Run helm-docs locally and commit README updates.\n"
          exit 1

      - name: Fail if not from branches renovate
        if: steps.check.outputs.no_changes == 'false' && ! startsWith(github.event.pull_request.head.ref, 'renovate')
        run: |
          echo -e "\n####### Git changes detected! Run helm-docs locally and commit README updates.\n"
          exit 1

      - name: Generate patch for Renovate branches
        if: |
          steps.check.outputs.no_changes == 'false' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'renovate')
        run: |
          git diff > changes.patch
        continue-on-error: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: |
          steps.check.outputs.no_changes == 'false' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'renovate')
        with:
          name: docs-patch
          path: changes.patch
