apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leantime.fullname" . }}
  labels:
    {{- include "leantime.labels" . | nindent 4 }}
spec:
  {{- $pluginMountPath := .Values.persistence.volumeMounts.plugins.mountPath }}
  {{- $pluginsMountedByUser := false }}
  {{- range .Values.volumeMounts }}
    {{- with .mountPath }}
      {{- if eq . $pluginMountPath }}
        {{- $pluginsMountedByUser = true }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "leantime.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "leantime.checksum" . | quote }}
        {{- if .Values.phpIni.enabled }}
        checksum/php-ini: {{ include "leantime.phpIniChecksum" . | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "leantime.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "leantime.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.envFromConfigMap.enabled .Values.envFromSecret.enabled .Values.extraEnvFrom }}
          envFrom:
            {{- if .Values.envFromConfigMap.enabled }}
            - configMapRef:
                name: {{ .Values.envFromConfigMap.existingConfigMap | default (printf "%s" (tpl .Values.envFromConfigMap.cmName $)) }}
            {{- end }}
            {{- if .Values.envFromSecret.enabled }}
            - secretRef:
                name: {{ .Values.envFromSecret.existingSecret | default (printf "%s" (tpl .Values.envFromSecret.secretName $)) }}
            {{- end}}
            {{- with .Values.extraEnvFrom }}
              {{- toYaml . | nindent 12 }}
            {{- end}}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- /*
            No readinessProbe on purpose: traffic is accepted during install
            and update. Liveness uses /health, which bypasses session, auth and
            install/update redirects, but still returns 503 when the database
            is unreachable.
          */ -}}
          livenessProbe:
            httpGet:
              path: {{ ternary "/healthCheck.php" "/health" .Values.testing.enabled }}
              port: http
          {{- if not .Values.testing.enabled }}
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.volumeMounts .Values.persistence.enabled .Values.phpIni.enabled }}
          volumeMounts:
            {{- if .Values.phpIni.enabled }}
            - name: php-ini
              mountPath: /usr/local/etc/php/conf.d/zz-leantime.ini
              subPath: zz-leantime.ini
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            {{- if and .Values.persistence.volumeMounts.plugins.enabled (not $pluginsMountedByUser) }}
            - name: {{ include "leantime.fullname" . }}
              mountPath: {{ .Values.persistence.volumeMounts.plugins.mountPath }}
              subPath: {{ .Values.persistence.volumeMounts.plugins.subPath }}
            {{- end }}
            {{- if .Values.persistence.volumeMounts.userFiles.enabled }}
            - name: {{ include "leantime.fullname" . }}
              mountPath: {{ .Values.persistence.volumeMounts.userFiles.mountPath }}
              subPath: {{ .Values.persistence.volumeMounts.userFiles.subPath }}
            {{- end }}
            {{- if .Values.persistence.volumeMounts.publicUserFiles.enabled }}
            - name: {{ include "leantime.fullname" . }}
              mountPath: {{ .Values.persistence.volumeMounts.publicUserFiles.mountPath }}
              subPath: {{ .Values.persistence.volumeMounts.publicUserFiles.subPath }}
            {{- end }}
            {{- end }}
            {{- with .Values.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes .Values.persistence.enabled .Values.phpIni.enabled }}
      volumes:
        {{- if .Values.phpIni.enabled }}
        - name: php-ini
          configMap:
            name: {{ .Values.phpIni.existingConfigMap | default (printf "%s-php-ini" (include "leantime.fullname" .)) }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: {{ include "leantime.fullname" . }}
          {{- if .Values.persistence.claim.enabled }}
          persistentVolumeClaim:
            claimName: {{ ternary (printf "%s" (include "leantime.fullname" .)) (.Values.persistence.existingClaim | quote) (empty .Values.persistence.existingClaim)  }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
