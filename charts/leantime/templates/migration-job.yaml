{{- if .Values.migration.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "leantime.fullname" . }}-migrate
  labels:
    {{- include "leantime.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "leantime.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "leantime.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Mirror the *_FILE handling from the image's /start.sh.
              for var in \
                LEAN_DB_PASSWORD LEAN_DB_USER LEAN_DB_HOST LEAN_DB_DATABASE \
                LEAN_SESSION_PASSWORD LEAN_EMAIL_SMTP_PASSWORD LEAN_EMAIL_SMTP_USERNAME \
                LEAN_S3_SECRET LEAN_REDIS_PASSWORD; do
                eval "file=\${${var}_FILE:-}"
                if [ -n "$file" ] && [ -f "$file" ]; then
                  export "$var=$(cat "$file")"
                fi
              done
              # Wait for the database port before starting the migration. A plain
              # TCP check works for MySQL/MariaDB and PostgreSQL, including TLS.
              until php -r 'exit(@fsockopen(getenv("LEAN_DB_HOST"), (int)(getenv("LEAN_DB_PORT") ?: 3306), $errno, $errstr, 2) ? 0 : 1);'; do
                sleep 2
              done
              exec php bin/leantime db:migrate --no-interaction
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.envFromConfigMap.enabled .Values.envFromSecret.enabled .Values.extraEnvFrom }}
          envFrom:
            {{- if .Values.envFromConfigMap.enabled }}
            - configMapRef:
                name: {{ .Values.envFromConfigMap.existingConfigMap | default (printf "%s" (tpl .Values.envFromConfigMap.cmName $)) }}
            {{- end }}
            {{- if .Values.envFromSecret.enabled }}
            - secretRef:
                name: {{ .Values.envFromSecret.existingSecret | default (printf "%s" (tpl .Values.envFromSecret.secretName $)) }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.migration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.volumeMounts }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if .Values.volumes }}
      volumes:
        {{- with .Values.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
